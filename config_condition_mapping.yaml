# ============================================
# Mapping pipeline configuration
# ============================================
verbatim_mapping:
  terms_folder: data/terms_condition
  verbatim_mapping_index_file: data/verbatim_condition_index.pkl
  download_batch_size: 100000
  log_folder: logs
  substrings_to_remove:
    - "(machine translation)"
    - "(disorder)"
    - "(event)"
    - "(finding)"
    - "(procedure)"
    - "unspecified"
    - "not otherwise specified"
    - "initial encounter for"
    - "initial encounter"
    - "subsequent encounter for"
    - "subsequent encounter"
  include_synonyms: true
  filter:
    standard_concept:
      - S
    vocabulary_ids:
      - SNOMED
      - LOINC
      - OMOP Extension
      - CPT4
      - HCPCS
      - ICD9Proc
      - ICD10PCS
      # Cancer ICDO3 Cancer Modifier 
    domain_ids:
      - Condition
      - Observation
      - Measurement
      - Procedure
      # drugs: RxNorm Ingredient CVX CVX  | Cancer Episode | Meas Value, Qualifier Value - for positive, negative, etc.
    concept_class_ids:
      - Clinical Finding
      - Disorder
      - Context-dependent
      - Social Context
      - Clinical Observation
      - Event
      - Observable Entity
      - Staging / Scales
      - Lab Test
      - Physical Object
      # cancer specific: ICDO Condition Node Metastasis + other classes of CA, less relevant

term_cleaning:
  # Concurrent LLM batches (25 terms each); 1 = sequential. Bounded by the rate limit.
  max_workers: 4
  system_prompt: |
    You are a clinical terminology parser. Your task is to extract only the core clinical term from a given string, removing any information that does not directly describe the essential concept—such as a condition, procedure, substance, or anatomical site—represented by the term.
    
    # Guidelines
    **Handling Modifiers**: Remove modifiers such as 'unspecified', 'not specified', 'in diseases classified elsewhere', and 'other' unless they are explicitly part of a medical term. For example, 'unspecified wrist' should be simplified to 'wrist' (unless 'unspecified wrist' is a recognized term). 
    
    **Absence of information**: Remove phrases indicating missing or absent information, such as 'without mention of', 'without documented severity score', 'unknown', and any dependent information. However, do not remove negations that are clinically relevant, such as 'without bleeding'.
    
    **Ambiguous Information**: Remove non-standard or ambiguous terms like 'with or without', 'classified elsewhere', and any dependent information.
    
    **Irrelevant Details**: Remove details unrelated to the clinical term, such as place of service ('initial encounter', 'subsequent encounter'), or origin of the term ('machine translation'). 
    
    **Keep**: Do not remove information indicating disease subclass, such as severity, class, stage, grade, remission status and others. Keep negative or equivocal results of laboratory test.
    
    # Examples

    Input JSON:
    {
      "terms": [
        {"row_number": 0, "source_term": "Unspecified enthesopathy, lower limb, excluding foot"},
        {"row_number": 1, "source_term": "Thyrotoxicosis with or without goiter"},
        {"row_number": 2, "source_term": "Other specified disorders of amniotic fluid and membranes, second trimester"},
        {"row_number": 3, "source_term": "Neoplasm of uncertain or unknown behavior of endocrine gland"},
        {"row_number": 4, "source_term": "Osteonecrosis due to previous trauma, other site"},
        {"row_number": 5, "source_term": "Unspecified synovitis and tenosynovitis, unspecified shoulder"},
        {"row_number": 6, "source_term": "Peptic ulcer without hemorrhage and without perforation"},
        {"row_number": 7, "source_term": "Bipolar disorder, mild"},
        {"row_number": 8, "source_term": "endosonography (machine translation)"},
        {"row_number": 9, "source_term": "Moderate persistent asthma, uncomplicated"}
        {"row_number": 10, "source_term": "Lack of coordination, classified elsewhere"},
        {"row_number": 11, "source_term": "Tuberculosis, not confirmed histologically"},
        {"row_number": 12, "source_term": "Newborn affected by forceps delivery"},
        {"row_number": 13, "source_term": "Viral and otherwise specified intestinal infections"}

      ]
    }

    Output JSON:
    {
      "terms": [
        {"row_number": 0, "cleaned_term": "enthesopathy, lower limb, excluding foot"},
        {"row_number": 1, "cleaned_term": "Thyrotoxicosis"},
        {"row_number": 2, "cleaned_term": "disorders of amniotic fluid and membranes, second trimester"},
        {"row_number": 3, "cleaned_term": "Neoplasm of endocrine gland"},
        {"row_number": 4, "cleaned_term": "Osteonecrosis due to previous trauma"},
        {"row_number": 5, "cleaned_term": "synovitis and tenosynovitis, shoulder"},
        {"row_number": 6, "cleaned_term": "Peptic ulcer without hemorrhage and without perforation"},
        {"row_number": 7, "cleaned_term": "Bipolar disorder, mild"},
        {"row_number": 8, "cleaned_term": "endosonography"},
        {"row_number": 9, "cleaned_term": "Moderate persistent asthma"}
        {"row_number": 10, "cleaned_term": "Lack of coordination"},
        {"row_number": 11, "cleaned_term": "Tuberculosis, not confirmed histologically"},
        {"row_number": 12, "cleaned_term": "Newborn affected by forceps delivery"},
        {"row_number": 13, "source_term": "intestinal infections"}
      ]
    }
    
    # Important
    
    Maintain information relevant for the clinical presentation, prognosis and treatment of the term. This includes information about severity, stage, timing, location, and body part (including lateratily).
    
    # Output format
    You will receive up to 25 source terms in one request, each with a row_number.
    Return exactly one JSON object with this structure and no additional keys:
    {
      "results": [
        {
          "row_number": integer,
          "cleaned_term": "string"
        }
      ]
    }
    Include one result for each input row_number.
    Do not include any text outside of the JSON object.

  # ICD "and" → "and/or" rewrite (per ICD-10-CM Section I.A). Logic lives in TermCleaner.
  and_or_rewrite:
    vocabulary_ids:
      - ICD10CM
      - ICD10
      - ICD9CM
      - CIM10
      - KCD7
      - EDI
      - ICD10GM
      - ICD10CN
    excluded_codes:
      - N70.13   # Chronic salpingitis and oophoritis
      - N70.93   # Salpingitis and oophoritis, unspecified
      - J35.03   # Chronic tonsillitis and adenoiditis
      - "474.02" # ICD9CM: Chronic tonsillitis and adenoiditis
    excluded_prefixes:
      - N83.33   # Acquired atrophy of ovary and fallopian tube
      - N83.51   # Torsion of ovary and ovarian ligament
      - N83.53   # Torsion of ovary, ovarian pedicle and fallopian tube
      - L76.     # Intraoperative/postprocedural hemorrhage and hematoma
    excluded_name_patterns:
      - "heart and .*(kidney|renal)"
      - "calculus .* gallbladder and bile"
      - "heatstroke and .*sunstroke"
    both_combined_exception_prefixes:
      - H26.06

pgvector_search:
  max_candidates: 25
  filter:
    standard_concept:
      - S
    vocabulary_ids:
      - SNOMED
      - LOINC
      - OMOP Extension
      - CPT4
      - HCPCS
      - ICD9Proc
      - ICD10PCS
    domain_ids:
      - Condition
      - Observation
      - Measurement
      - Procedure
    concept_class_ids:
      - Clinical Finding
      - Disorder
      - Context-dependent
      - Social Context
      - Clinical Observation
      - Event
      - Observable Entity
      - Staging / Scales
      - Lab Test
      - Physical Object

llm_mapping:
  llm_mapper_responses_folder: data/llm_condition_mapper_responses
  context:
    include_target_parents: True
    include_target_children: True
    include_target_synonyms: True
    include_target_domain: True
    include_target_class: True
    include_target_vocabulary: True
    re_insert_source_target_details: True
  system_prompts:
    - |
      You are a meticulous medical terminology expert.
      Your task is to find the single standard concept that is equivalent to a source term based on their clinical presentation, prognosis and treatment, or indicate when such a match does not exist.
      You will be provided with a JSON object containing a source term and a list of target concepts, each with its vocabulary context.
      
      Your primary goal is to find an exact clinical equivalent. Evaluate each target concept against the source term using the following rules:
      
      1. Maintain Specificity (Do not broaden): The target must not be more general than the source. It must preserve all key clinical details present in the source term, including severity, stage, timing, location, and body part. For example, 'Depression' is a bad match for 'Mild depression',  'Fracture of lower limb' is a bad match for 'Fracture of femur', 'Depression' is a bad match for 'Depression in remission', 'Arthritis' is a bad match for 'Arthritis of hand', 'Arthropathy, monoarticular' is a bad match for 'Arthropathy, wrist'.
      
      2. Maintain Generality (Do not over-specify): The target must not be more specific than the source term (e.g., a subtype or a term with added details not present in the source). For example, 'Fracture of left leg' is a bad match for 'Fracture of leg', 'Migraine without aura' is a bad match for 'Migraine', 'Open fracture with bleeding' is a bad match for 'Open fracture', 'Blood pressure below reference range' is a bad match for 'Hypotension level'.
      
      3. Validate Target Context: Review the target concept's vocabulary context (its synonyms, class, domain, parents, and children). It must be clinically and semantically appropriate for the source term.
 
      4. Incorporate Source Context: Review the source term's context (its children, parents, description) and use it to contextualize the source term.

      5. Ignore non-essential phrases such as 'unspecified', 'not otherwise specified', or 'in diseases classified elsewhere'.
      
      6. If the best match is not an exact match, declare it to be no match.
      
      Output Format:
      Provide your response in a single JSON object. Do not include any text outside of the JSON.
      JSON
      {
        "source_term": "string",
        "match_found": boolean,
        "concept_id": "integer or null",
        "justification": "string"
      }

# ============================================
# Hierarchy pipeline configuration
# ============================================
hierarchy:

  index_build:
    embedding_batch_size: 500
    embedding_cache_folder: data/hierarchy_embedding_cache

  retrieval:
    num_reference_examples: 5
    top_k_per_category: 25
    hnsw_ef_search: 1000

  parent_selection:
    num_neighbours: 10
    candidate_pool_size: 50
    min_similarity: 0.6
    min_support: 0.5
    max_parents: 2
    root_concept_id: 441840
    primitive_status_concept_id: 40642538
    exclude_source_descendants: true
    max_workers: 4
    neighbour_cache_file: data/notebook_results/hierarchy_parent_selection_neighbours.json

  evaluation:
    output_dir: "data/notebook_results"
    max_workers: 4

  # SNOMED CT attributes used by the hierarchy pipeline:
  # pipeline key -> SNOMED attribute concept (RF2 typeId) and OHDSI relationship_id.
  attributes:
    associated_morphology:        {attribute_id: 116676008, ohdsi_relationship: "Has asso morph"}
    finding_site:                 {attribute_id: 363698007, ohdsi_relationship: "Has finding site"}
    causative_agent:              {attribute_id: 246075003, ohdsi_relationship: "Has causative agent"}
    pathological_process:         {attribute_id: 370135005, ohdsi_relationship: "Has pathology"}
    occurrence:                   {attribute_id: 246454002, ohdsi_relationship: "Has occurrence"}
    clinical_course:              {attribute_id: 263502005, ohdsi_relationship: "Has clinical course"}
    severity:                     {attribute_id: 246112005, ohdsi_relationship: "Has severity"}
    due_to:                       {attribute_id: 42752001,  ohdsi_relationship: "Has due to"}
    during:                       {attribute_id: 371881003, ohdsi_relationship: "During"}
    occurs_after:                 {attribute_id: 255234002, ohdsi_relationship: "Occurs after"}
    finding_asso_with:            {attribute_id: 47429007,  ohdsi_relationship: "Finding asso with"}
    interprets:                   {attribute_id: 363714003, ohdsi_relationship: "Has interprets"}
    interpretation:               {attribute_id: 363713009, ohdsi_relationship: "Has interpretation"}
    associated_finding:           {attribute_id: 246090004, ohdsi_relationship: "Has asso finding"}  # not extracted yet
    finding_context:              {attribute_id: 408729009, ohdsi_relationship: "Has finding context"}
    temporal_context:             {attribute_id: 408731000, ohdsi_relationship: "Has temporal context"}
    subject_relationship_context: {attribute_id: 408732007, ohdsi_relationship: "Has relat context"}

  # SNOMED CT Machine Readable Concept Model (MRCM) rules used to build and validate role groups
  mrcm:
    folder: data/mrcm
    content_types:
      - 723596005  # All SNOMED CT content
      - 723594008  # All precoordinated content
    domains:
      clinical_finding: 404684003                # Clinical finding (finding)
      situation_with_explicit_context: 243796009 # Situation with explicit context (situation)
      finding_with_explicit_context: 413350009   # Finding with explicit context (situation); sub-domain of 243796009
    default_domain: clinical_finding

    grouping:
      self_grouped: [due_to, clinical_course, severity, during, occurs_after, finding_asso_with]
      clusters:
        core: [finding_site, associated_morphology, pathological_process, occurrence, causative_agent]
        interpretation: [interprets, interpretation]
        context: [associated_finding, finding_context, temporal_context, subject_relationship_context]
      llm_grouped_clusters: [core]
      requires:
        interpretation: interprets

  prompts:
    extraction: |
      You are a SNOMED CT concept model expert. Determine which defining attributes apply to a medical term based on its clinical meaning. Attributes are often IMPLICIT — use clinical knowledge to infer them, not just surface words.
      
      # Attribute Definitions & Rules
      
      1. CORE CLINICAL ATTRIBUTES
      - associated_morphology: The characteristic structural change at tissue or cellular level. Infer established entities, such as "-itis" to "Inflammatory morphology"/"Chronic inflammation"/"Acute inflammation" and stenosis to "Stenosis". Preserve explicitly stated acuity, behavior, histology, multiplicity, and composite morphology. Do not infer congenitality through morphology when it can be represented by occurrence and pathological_process.
      - finding_site: The anatomical location. Derive the site from disease names (e.g., "esophag-" → esophageal structure). Select the most specific BODY STRUCTURE concept entailed by the term; do not infer tissue, layer, lumen, substructure, laterality, or whole-entity involvement from plausibility alone. SEP rule: use X structure for unspecified involvement of some or all of X; use Entire X only when the defining model entails the complete countable anatomical entity; use Part of X only for an unspecified proper part; use X region for a broad three-dimensional anatomical area.
      - causative_agent: The organism, substance, product, physical object, or physical force directly responsible for the condition.
      - due_to: Another condition or event directly causing the condition. Mandatory injury rule: If the term denotes an injury, set due_to to "Traumatic event", even when trauma is implicit and the words “trauma” or “traumatic” do not appear. This includes abrasions, wounds, contusions, sprains, burns, fractures, dislocations, and other traumatic injuries.
      - clinical_course: The defining temporal pattern of the condition, such as acute, chronic, subacute, or recurrent. Assign only when represented as a distinct defining characteristic, not solely because similar wording occurs inside a composite morphology.
      - severity: E.g., mild, moderate, severe.
      - occurrence: The life stage or developmental period in which the condition necessarily occurs, such as congenital, neonatal, fetal, or infantile. Do not infer congenital occurrence from "genetic", "familial", or "hereditary" alone.
      - during: The procedure during which the finding occurs, such as "Delivery procedure" or "Surgical procedure". Use occurrence, not during, for maternal, fetal, neonatal, or other life phases.
      - occurs_after: Use when the finding occurs after another finding, event, or procedure. It expresses temporal sequence without implying causation. When both causation and sequence are explicit, use both due_to and occurs_after. Cues include "after", "following", "postoperative", "postablative", "posttransplant", and "late effect".

      2. CONTEXT ATTRIBUTES (Situation with Explicit Context)
      Scan every term for implied context. Provide these ONLY when a term explicitly overrides the default assumption of a current, confirmed diagnosis in the patient (e.g., history, family history, suspected, ruled out).
      - finding_context: Select the exact SNOMED CT finding-context value expressed by the term, such as Known present, Known absent, Possible, Suspected, or Confirmed present. Do not add context attributes to ordinary current findings.
      - temporal_context: Values: Current or specified time, Past. (Use "Past" for terms containing "History of"). Do NOT output for standard current findings.
      - subject_relationship_context: The relationship of the subject. Values: Subject of record, Person in family of subject, Maternal, Fetal, Donor. Do NOT output for standard findings in the patient.
        * NOTE: "Family history of [Disease]" is modeled as: finding_context = Known present; temporal_context = Current or past; subject_relationship_context = Person in family of subject.
      
      3. COMPLEX / CONDITIONAL ATTRIBUTES
      - interprets_interpretation: PAIRED ATTRIBUTES. Use ONLY when the condition is fundamentally defined by an abnormal result for a specific named, measurable SNOMED observable. 
        * Valid triggers: blood/urine analytes, named organ-function tests, or named size measurements. 
        * For endocrine hypo-/hyperfunction, select the exact observable used in the target or analogous SNOMED CT model. Common models use "Hormone production"; use a secretion observable only when secretion is specifically represented.
        * Format as a list of dictionaries: [{"interprets": "...", "interpretation": "..."}]. Never provide one without the other.
        * Use only when the SNOMED CT model represents the finding as an interpretation of a named observable or function. Do not infer an observable solely from general clinical knowledge.
        * Reference rule: the observable does NOT need to be named in the term. If the closest reference examples (subtypes, parents or siblings of the same disorder) consistently model interprets/interpretation pairs, output ALL of those pairs using the reference concept names verbatim. When references disagree, follow the one matching the term's direction (hypo-/hyper-, deficiency/excess) and analyte.
        * For combined terms ("X and Y"), output the union of the pairs modeled for each component; do not keep only the shared ones.
        * For measurement findings, prefer Above/Below/Within/Outside reference range over generic Increased/Decreased/Normal/Abnormal when applicable.
        * Invalid triggers: Generic dysfunction, paralysis, vague anatomical deformities.
      - pathological_process: Assign only when supported by the term or an analogous reference model:
        (1) Pathological developmental process: congenital or developmental structural abnormalities when pathological development defines the disorder. Do not infer it from hereditary/genetic alone, and do not use it for congenital neoplasms.
        (2) Primary malignant neoplastic proliferation: only for terms explicitly stating "Primary malignant neoplasm of [site]".
        (3) Infectious process: when infection is explicit or the disease is inherently infectious. Do not infer infection from "-itis" or inflammation alone. Add causative_agent only when a specific organism or agent is specified.
        (4) Abnormal immune process or an appropriate subtype, such as Autoimmune process or Allergic process, when the disorder is explicitly immune-mediated.
        (5) Use a more specific allergic-process subtype, such as Non-immunoglobulin E-mediated allergic process, only when supported.
      - finding_asso_with: The primary associated condition when the term is explicitly "X in [Disease Y]" or "X complicating Y", and Y is a named disease that is neither the morphology, causative agent or disease, nor finding site.
      
      - Return only necessarily defining attributes, not features that are merely common, clinically plausible, or variably present.
      - Prefer an exact combined morphology when it represents the complete abnormality at one site; otherwise preserve required separate morphologies and sites.
      - Multiple finding sites may be required. Do not collapse separately modeled sites into one combined site.
      - Use close reference examples as evidence of released SNOMED CT modeling patterns only when the clinical meaning and attribute relationships are analogous.

      {grouping_section}
      {reference_section}
      
      # Examples
      Term: Hypoglycemic disorder
      Output JSON:
      {{
          "interprets_interpretation": [{{"interprets": "Blood glucose concentration", "interpretation": "Below reference range"}}]
      }}

      Term: Reduction deformity of lower limb
      Output JSON:
      {{
          "role_groups": [
              {{"associated_morphology": "Abnormal shortening", "finding_site": "Entire lower limb", "occurrence": "Congenital", "pathological_process": "Pathological developmental process"}}
          ]
      }}

      Term: Family history of diabetes mellitus type 2
      Output JSON:
      {{
          "finding_context": ["Known present"],
          "temporal_context": ["Current or past"],
          "subject_relationship_context": ["Person in family of subject"]
      }}

      Term: Open fracture of clavicle
      Output JSON:
      {{
          "role_groups": [{{"associated_morphology": "Fracture, open", "finding_site": "Bone structure of clavicle"}}],
          "due_to": ["Traumatic event"]
      }}

      Term: Acute tracheobronchitis
      Output JSON:
      {{
          "role_groups": [
              {{"associated_morphology": "Acute inflammation", "finding_site": "Tracheal structure"}},
              {{"associated_morphology": "Acute inflammation", "finding_site": "Bronchial structure"}}
          ],
          "clinical_course": ["Sudden onset AND/OR short duration"]
      }}

      Term: Postoperative heterotopic calcification
      Output JSON:
      {{
          "role_groups": [{{"associated_morphology": "Pathologic calcification"}}],
          "occurs_after": ["Surgical procedure"]
      }}

      Term: Infection of bone
      Output JSON:
      {{
          "role_groups": [{{"finding_site": "Bone structure", "pathological_process": "Infectious process"}}]
      }}

      Output Format:
      Provide your response in a single JSON object. Do not include any text outside of the JSON.
      Return JSON with attribute keys (snake_case) and list values (or null). Use clinical reasoning — think about what a domain expert would know, not just what words appear in the term. Multiple values per attribute are allowed.
      associated_morphology, finding_site, causative_agent, pathological_process and occurrence go ONLY inside "role_groups" (one value per attribute per group; null if none apply).
      JSON:
      {{
          "role_groups": [
              {{"associated_morphology": null, "finding_site": null, "causative_agent": null, "pathological_process": null, "occurrence": null}}
          ],
          "due_to": null,
          "clinical_course": null,
          "severity": null,
          "during": null,
          "occurs_after": null,
          "interprets_interpretation": null,
          "finding_asso_with": null,
          "finding_context": null,
          "temporal_context": null,
          "subject_relationship_context": null
      }}

    selection: |
      You are a SNOMED CT concept model expert. Your task is to select the most accurate SNOMED CT concept for each extracted attribute from the provided list of candidate concepts. 
      
      === GENERAL RULES ===
      1. Select ONLY from the provided candidates. Do not invent, hallucinate, or guess concept IDs or names.
      2. Select the most specific concept entailed by the source term and reference modeling. Do not infer tissue, layer, lumen, substructure, laterality, or entire-organ involvement merely because it is clinically plausible.
      3. An attribute may have MULTIPLE correct values (e.g., multiple morphologies). Return them as a list.
      4. If no provided candidate accurately represents the attribute based on the medical term, return null for that attribute. Applicable exact values from extraction should be present in the candidate list; prefer them over weaker embedding matches.
      
      === ATTRIBUTE-SPECIFIC GUIDELINES ===
      
      A. CORE CLINICAL ATTRIBUTES
      - finding_site: Candidate MUST belong to the BODY STRUCTURE hierarchy. Pick the most specific site entailed by the term. SEP rule: use X structure for unspecified involvement of some or all of X; use Entire X only when the defining model entails the complete countable anatomical entity; use Part of X only for an unspecified proper part; use X region for a broad three-dimensional anatomical area. Multiple separately modeled sites may be required; do not replace them with one combined site.
      - associated_morphology: Candidate MUST belong to the MORPHOLOGIC ABNORMALITY hierarchy (e.g., "Inflammatory morphology", "Malignant neoplasm"). Prefer the exact reference-modeled morphology over a clinically related subtype or more specific alternative. Prefer an exact combined morphology when it represents the complete abnormality at one site. 
      - finding_asso_with: Select the SNOMED CLINICAL FINDING concept representing the explicitly named associated disease. Do not confuse this with causative_agent (which is for infectious organisms/substances).
      - severity: Map adjectives to "Mild", "Moderate", or "Severe" qualifier values.
      
      B. TIME & LIFE STAGE (During vs. Occurrence)
      - during (Phase of care): 
        - ante-, prenatal → "Antepartum period" or "Prenatal period"
        - peri-, intrapartum, delivery, labor → "Intrapartum period" or "Delivery period" (prefer the narrowest match)
        - post-, postpartum, puerperium → "Postpartum period"
        - post-operative → "Postoperative period"
      - occurrence (Life stage):
        - neonatal, newborn → "Neonatal period"
        - congenital, fetal, infantile → Select the respective developmental/life-stage concept.
      
      C. CONTEXT ATTRIBUTES (Strict SNOMED CT Context Model)
      Do not drop context attributes if the source phrase contains matching cues (history, suspected, family, etc.).
      - temporal_context: "History of" maps to "Past"; family history commonly maps to "Current or past" according to the target SNOMED CT definition.
      - finding_context: Select the exact candidate expressed by the source, such as Known present, Known absent, Possible, Suspected, or Confirmed present. Do not substitute Rule out for Known absent unless the target model supports that value.
      - subject_relationship_context: "Family history of [X]" does NOT use a single "family history" concept. It must be mapped as:
        - finding_context = Known present
        - temporal_context = Current or past
        - subject_relationship_context = Person in family of subject
      
      D. INTERPRETS & INTERPRETATION (Quantitative/Functional Change)
      - These are ALWAYS paired. Return together as "interprets_interpretation" — never one without the other.
      - interpretation: For measurement findings, prefer Above/Below/Within/Outside reference range. Use Increased or Decreased for non-measurement functions or when required by the target SNOMED CT model.
      - interprets (Endocrine): Select the exact observable used in the target or analogous SNOMED CT model. Common models use "Hormone production"; use a secretion observable only when secretion is specifically represented.
      - interprets (Joints): For joint contracture/stiffness terms, the interprets observable is "Range of [joint] movement" (e.g., "Elbow joint - range of movement") — NOT generic "Movement".
      - The observable does NOT need to be named in the term. If the closest reference examples (subtypes, parents or siblings of the same disorder) consistently model an interprets/interpretation pair and matching candidates are available, select that pair. "Not stated in the term" is not a valid reason to drop a reference-supported pair.
      - When references disagree, trust the reference that matches the term's direction (hypo-/hyper-, deficiency/excess) and analyte. A broader or opposite-direction reference without the pair does not outweigh a direction-matched reference that has it.
      - For combined terms ("X and Y"), keep the union of the pairs modeled for each component; do not drop a pair because only one component carries it.
      
      === FINAL SELECTION CHECKS ===
      - Return only necessarily defining attributes. Clinical plausibility alone is insufficient, but consistent modeling in close reference examples IS sufficient evidence.
      - Use close reference examples as evidence only when clinically analogous. Prefer an exact reference-derived candidate over a semantically weaker embedding match.
      - Do not add a separate generic morphology when an exact combined morphology already represents the complete abnormality.
      - clinical_course: Select only when supported by the target SNOMED CT model or a close reference example; do not assume every lexical "acute", "chronic", "progressive", or "recurrent" is modeled with this attribute.
      - occurs_after: Select for temporal sequence; select due_to separately only when causation is explicit or mandated by the injury rule.

      === ROLE GROUPS ===
      - Return associated_morphology, finding_site, causative_agent, pathological_process and occurrence inside "role_groups", not in "attributes".
      - Start from the "Proposed role groups" in the user message (if given). Keep their structure unless it contradicts the term, merge groups that describe the same process, and drop groups whose values were all rejected.
      - Example: "Acute tracheobronchitis" has two groups — {Acute inflammation, Tracheal structure} and {Acute inflammation, Bronchial structure} — and clinical_course "Sudden onset AND/OR short duration" in "attributes".
      {grouping_section}
