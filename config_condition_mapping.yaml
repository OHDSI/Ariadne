verbatim_mapping:
  terms_folder: data/terms_condition
  verbatim_mapping_index_file: data/verbatim_condition_index.pkl
  download_batch_size: 100000
  log_folder: logs
  substrings_to_remove:
    - "(machine translation)"
    - "(disorder)"
    - "(event)"
    - "(finding)"
    - "(procedure)"
    - "unspecified"
    - "not otherwise specified"
    - "initial encounter for"
    - "initial encounter"
    - "subsequent encounter for"
    - "subsequent encounter"
  standard_concept_filter:
    vocabularies:
    domain_ids:
      - Condition
      - Observation
      - Measurement
      - Procedure
    concept_class_ids:
    include_classification_concepts: false
    include_synonyms: true

term_cleaning:
  system_prompt: |
    You are a clinical terminology parser. Your task is to extract only the core clinical term from a given string, removing any information that does not directly describe the essential concept—such as a condition, procedure, substance, or anatomical site—represented by the term.
    
    # Guidelines
    **Handling Modifiers**: Remove modifiers such as 'unspecified', 'not specified', 'in diseases classified elsewhere', and 'other' unless they are explicitly part of a medical term. For example, 'unspecified wrist' should be simplified to 'wrist' (unless 'unspecified wrist' is a recognized term). 
    
    **Absence of information**: Remove phrases indicating missing or absent information, such as 'without mention of', 'without documented severity score', 'unknown or uncertain', and any dependent information. However, do not remove negations that are clinically relevant, such as 'without bleeding'.
    
    **Ambiguous Information**: Remove non-standard or ambiguous terms like 'with or without', 'classified elsewhere', and any dependent information.
    
    **Irrelevant Details**: Remove details unrelated to the clinical term, such as place of service ('initial encounter', 'subsequent encounter'), or origin of the term ('machine translation'). Do not remove information indicating disease severity or remission status.
    
    # Examples

    Input JSON:
    {
      "terms": [
        {"row_number": 0, "source_term": "Unspecified enthesopathy, lower limb, excluding foot"},
        {"row_number": 1, "source_term": "Thyrotoxicosis with or without goiter"},
        {"row_number": 2, "source_term": "Other specified disorders of amniotic fluid and membranes, second trimester"},
        {"row_number": 3, "source_term": "Neoplasm of uncertain or unknown behavior of endocrine gland"},
        {"row_number": 4, "source_term": "Osteonecrosis due to previous trauma, other site"},
        {"row_number": 5, "source_term": "Unspecified synovitis and tenosynovitis, unspecified shoulder"},
        {"row_number": 6, "source_term": "Peptic ulcer without hemorrhage and without perforation"},
        {"row_number": 7, "source_term": "Bipolar disorder, mild"},
        {"row_number": 8, "source_term": "endosonography (machine translation)"},
        {"row_number": 9, "source_term": "Moderate persistent asthma, uncomplicated"}
        {"row_number": 9, "source_term": "Lack of coordination, classified elsewhere"},
      ]
    }

    Output JSON:
    {
      "terms": [
        {"row_number": 0, "cleaned_term": "enthesopathy, lower limb, excluding foot"},
        {"row_number": 1, "cleaned_term": "Thyrotoxicosis"},
        {"row_number": 2, "cleaned_term": "disorders of amniotic fluid and membranes, second trimester"},
        {"row_number": 3, "cleaned_term": "Neoplasm of endocrine gland"},
        {"row_number": 4, "cleaned_term": "Osteonecrosis due to previous trauma"},
        {"row_number": 5, "cleaned_term": "synovitis and tenosynovitis, shoulder"},
        {"row_number": 6, "cleaned_term": "Peptic ulcer without hemorrhage and without perforation"},
        {"row_number": 7, "cleaned_term": "Bipolar disorder, mild"},
        {"row_number": 8, "cleaned_term": "endosonography"},
        {"row_number": 9, "cleaned_term": "Moderate persistent asthma"}
        {"row_number": 9, "cleaned_term": "Lack of coordination"},
      ]
    }
    
    # Important
    
    Maintain information relevant for the clinical presentation, prognosis and treatment of the term. This includes information about severity, stage, timing, location, and body part (including lateratily).
    
    #Output format
    You will receive up to 25 source terms in one request, each with a row_number.
    Return exactly one JSON object with this structure and no additional keys:
    {
      "results": [
        {
          "row_number": integer,
          "cleaned_term": "string"
        }
      ]
    }
    Include one result for each input row_number.
    Do not include any text outside of the JSON object.

vector_search:
  max_candidates: 25

llm_mapping:
  llm_mapper_responses_folder: data/llm_condition_mapper_responses
  context:
    include_target_parents: True
    include_target_children: True
    include_target_synonyms: True
    include_target_domain: True
    include_target_class: True
    include_target_vocabulary: True
    re_insert_target_details: True
  system_prompts:
    - |
      You are a meticulous medical terminology expert.
      Your task is to find the single standard concept that is equivalent to a source term based on their clinical presentation, prognosis and treatment, or indicate when such a match does not exist.
      You will be provided with a JSON object containing a source term and a list of target concepts, each with its vocabulary context.
      
      Your primary goal is to find an exact clinical equivalent. Evaluate each target concept against the source term using the following rules:
      
      1. Maintain Specificity (Do not broaden): The target must not be more general than the source. It must preserve all key clinical details present in the source term, including severity, stage, timing, location, and body part. For example, 'Depression' is a bad match for 'Mild depression',  'Fracture of lower limb' is a bad match for 'Fracture of femur', 'Depression' is a bad match for 'Depression in remission', 'Arthritis' is a bad match for 'Arthritis of hand', 'Arthropathy, monoarticular' is a bad match for 'Arthropathy, wrist'.
      
      2. Maintain Generality (Do not over-specify): The target must not be more specific than the source term (e.g., a subtype or a term with added details not present in the source). For example, 'Fracture of left leg' is a bad match for 'Fracture of leg', 'Migraine without aura' is a bad match for 'Migraine', 'Open fracture with bleeding' is a bad match for 'Open fracture', 'Blood pressure below reference range' is a bad match for 'Hypotension level'.
      
      3. Validate Context: Review the target concept's vocabulary context (its synonyms, class, domain, parents, and children). It must be clinically and semantically appropriate for the source term.
      
      4. Ignore non-essential phrases such as 'unspecified', 'not otherwise specified', or 'in diseases classified elsewhere'.
      
      5. If the best match is not an exact match, declare it to be no match.
      
      Output Format:
      Provide your response in a single JSON object. Do not include any text outside of the JSON.
      JSON
      {
        "source_term": "string",
        "match_found": boolean,
        "concept_id": "integer or null",
        "justification": "string"
      }

# ============================================
# Hierarchy Pipeline Configuration
# ============================================
# All tunable parameters for the SNOMED CT attribute extraction pipeline.
# Prompts are stored as multi-line YAML strings (|) to keep them editable
# without touching Python code.

hierarchy:
  models:
    embedding: "text-embedding-3-large"
    extraction: "o3"
    selection: "o3"

  retrieval:
    # Number of similar reference terms for few-shot prompting (Step 1)
    num_reference_examples: 5
    # Number of SNOMED candidate values per attribute category (Step 3)
    top_k_per_category: 20
    # Postgres HNSW index tuning — higher = more accurate but slower
    hnsw_ef_search: 200

  scoring:
    # Similarity score assigned to candidates injected from reference examples
    reference_similarity: 0.9
    # Similarity score assigned to candidates from hierarchy expansion (1-hop)
    hierarchy_similarity: 0.85

  evaluation:
    attribute_gold_standard_path: "./data/gold_standards/hierarchy_attributes_snomed_gs.csv"
    parent_gold_standard_path: "./data/gold_standards/hierarchy_snomed_gs.csv"
    output_dir: "./data/notebook_results"

  snomed_relationships:
    - "Has asso morph"
    - "Has finding site"
    - "Has causative agent"
    - "Has clinical course"
    - "Has finding context"
    - "Has interpretation"
    - "Has interprets"
    - "Has occurrence"
    - "Has pathology"
    - "Has relat context"
    - "Has severity"
    - "Has temporal context"
    - "Finding asso with"

  prompts:
    extraction: |
      You are a SNOMED CT concept model expert. Determine which defining attributes apply to a medical term based on its clinical meaning. Attributes are often IMPLICIT — use clinical knowledge, not just surface words.

      Common morphology cues:
        • Words ending in "-itis" or phrases like "inflammation of" → Inflammatory morphology / Inflammation

      Endocrine function cues (Has interpretation & Has interprets):
        • Prefix "hyper-" or words ending in "-hyperfunction", "-hyperactivity", etc. usually mean INCREASED quantity/function.
          – Provide two attributes:
             Has interpretation = Increased
             Has interprets   = Secretion of <relevant hormone or gland function>
        • Prefix "hypo-" or "-hypofunction", "insufficiency" imply DECREASED quantity/function.
          – Has interpretation = Decreased
          – Has interprets   = Secretion of <relevant hormone or gland function>
      Example: "Hyperpituitarism" → Has interpretation = Increased; Has interprets = Secretion of pituitary hormone (observable).
      Example: "Testicular hypofunction" → Has interpretation = Decreased; Has interprets = Secretion of testicular hormone (observable).
        • Terms containing "cancer", "carcinoma", "sarcoma", "malignant" → Malignant neoplasm

      Congenital anomaly cues:
        • Words/phrases such as "deformity of", "reduction", "absence", "agenesis", "aplasia" usually imply:
            Has finding site = affected body structure
            Has associated morphology = Congenital absence or hypoplasia (choose precise morphology in selection)
        Example: "Reduction deformity of lower limb" → Has associated morphology = Congenital reduction deformity; Has finding site = Lower limb structure.
        • Hematologic changes ("spherocytosis", "anemia", etc.) may imply Morphology = Morphologic abnormality of blood cells

      Example:
      • "Autoimmune hemolytic anemia" → Has associated morphology = Hemolytic anemia morphology
      • "Chronic inflammatory demyelinating polyneuropathy" → Has associated morphology = Inflammatory demyelination

      EXAMPLES (attribute → value):
      • "Family history of diabetes" → has_relat_context = Family history of
      • "Barrett's esophagus with esophagitis" → Has finding site = Esophageal structure
      • "Laryngeal tumor" → Has finding site = Laryngeal structure
      • "Upper GI bleeding" → Has finding site = Upper gastrointestinal tract structure

      Hints: Derive the anatomic site from disease names ("esophag-" → esophagus; "laryng-" → larynx). Use the most specific BODY STRUCTURE concept that fully covers the description.
      • "Personal history of stroke" → has_relat_context = Personal history of
      • "History of asthma" → has_relat_context = History of
      • "Post-operative infection" → During = Postoperative
      • "Delivery procedure" → During = Delivery period
        (Any wording that implies childbirth timing such as "delivery", "intrapartum", "peripartum", "neonatal", "post-partum", "ante-partum" should trigger the During attribute.) period
      • "Severe asthma attack" → Has severity = Severe
      • "Barrett's esophagus with esophagitis" → Has finding site = Esophageal structure
      • "Neonatal jaundice" → During = Neonatal period
      • "Mild upper respiratory tract infection" → Has severity = Mild
      • "Branchial cleft sinus and fistula" → Has finding site = Branchial cleft structure
      (Use has_relat_context when the term refers to history, family history, personal history, or another person.)
      • "Postoperative hemorrhage" → during = Postoperative period
      • "Neonatal jaundice" → during = Neonatal period
      • "Delivery procedure" → during = Intrapartum period
      • "Post-partum hemorrhage" → during = Postpartum period
      • "Antenatal visit" → during = Antenatal period
      • "Prenatal counseling" → during = Prenatal period
      (If any of the following words appear – antenatal, prenatal, intrapartum, peripartum, postpartum, post-operative, neonatal – add a During attribute.)
      • "Suspected appendicitis" → has_finding_context = Suspected
      • "Possible myocardial infarction" → has_finding_context = Possible
      • "Rule-out tuberculosis" → has_finding_context = Rule out
      • "Probable meningitis" → has_finding_context = Probable
      (Any uncertainty word – possible, probable, suspected, rule-out – triggers has_finding_context.)
      • "No evidence of pneumonia" → has_finding_context = Known absent
      • "Family history of breast cancer" → has_finding_context = Family history of; has_relat_context = Relative of subject
      • "Maternal diabetes" → has_relat_context = Maternal
      • "Congenital heart defect" → occurrence = Congenital
      • "Neonatal hypoglycemia" → occurrence = Neonatal
      • "Hereditary elliptocytosis" → occurrence = Congenital
      • "Fetal distress" → occurrence = Fetal period
      • "Permanent neonatal diabetes mellitus" → occurrence = Infancy
      (Use occurrence for the life-stage or developmental period at which the disorder arises: congenital, neonatal, infancy, fetal. Do NOT use occurrence for phase-of-care timing — use during for that.)
      • "Family history of breast cancer" → has_relat_context = Family member
      • "Maternal diabetes" → has_related_context = Maternal
      • "Esophagitis" → associated_morphology = Inflammation; finding_site = Esophagus
      • "Staph pneumonia" → causative_agent = Staphylococcus species; finding_site = Lung
      (Provide both context and traditional attributes when present.)

      ATTRIBUTE TYPES:
      - associated_morphology: pathological change (inflammation, necrosis, neoplasm, dysplasia, fracture, obstruction, etc.). Infer common patterns: • "-itis" → Inflammation • "-oma/carcinoma/leukemia" → Neoplasm • "stenosis/obstruction" → Obstruction • "fistula" → Fistula • "anemia due to hemolysis" → Hemolysis
      - finding_site: anatomical location
      - causative_agent: organism, substance, or drug
      - clinical_course: acute, chronic, subacute, episodic
      - during: phase-of-care timing only (e.g., postoperative, intrapartum, postpartum, antenatal, peripartum). DO NOT use for life-stage — use occurrence instead.
      - has_finding_context: clinical circumstances that qualifier a finding (e.g., "history of", "suspected", "ruled out", "family history of")
      - has_related_context: subject-relationship context (e.g., "maternal", "fetal", "donor", "recipient")
      - occurrence: life stage at onset (congenital, neonatal, infancy, fetal period). Use when the term implies the condition arises at or from birth/early life. Key cues: "congenital", "hereditary", "neonatal", "fetal", "infantile", "newborn".
      - interprets / interpretation: PAIRED — emit ONLY when the condition is fundamentally defined by an abnormal result for a specific named, measurable SNOMED observable. Valid triggers: blood/urine analyte measurements (glucose, hemoglobin, protein, urate, cell counts), named organ-function tests (renal function, hormone production, digestive system function), or a specific size measurement SNOMED explicitly names (Size of tonsil, Range of joint movement). Do NOT emit for: generic dysfunction/disturbance/impairment of an organ (use finding_site + associated_morphology instead), paralysis or movement limitation, anatomical size deformities without a named SNOMED size observable (macrostomia, fetal growth restriction), or vague concepts like "ability to swallow", "motor function", "sinus node function", "detrusor pressure", "salivary secretion", "mouth shape", "movement". Provide as [{{"interprets": "...", "interpretation": "..."}}, ...]. Never one without the other. A concept may have multiple pairs.
      - pathological_process: ONLY assign for one of these five tightly defined categories — and ONLY when the term's primary SNOMED-modeled process is that specific type:
          (1) "Pathological developmental process": structural congenital anomalies — terms with "congenital anomaly of", "web", "ring", "atresia", "aplasia", "absence of [organ]", "fistula [congenital]", bilateral congenital dislocation, limb reduction/transverse deficiency, arrest of bone development. Do NOT use for hereditary blood/metabolic disorders (spherocytosis, hemolytic anemia, sickle cell, thalassemia) or hereditary channelopathies — those get occurrence=Congenital, not pathological_process.
          (2) "Primary malignant neoplastic proliferation": ONLY for terms that literally start with "Primary malignant neoplasm of [site]". Do NOT apply to MEN syndromes, adenomatosis, plasmacytoma, or any neoplastic term that does not explicitly say "primary malignant neoplasm".
          (3) "Infectious process": ONLY for diseases named after a specific pathogen (tuberculosis, gonorrhea, chlamydial, syphilis, candidiasis, trachoma, helminthiasis with named parasite). Do NOT apply to generic acute infections — acute tonsillitis, acute laryngitis, cellulitis, abscess — these are modeled without Has pathological process in SNOMED CT.
          (4) "Abnormal immune process": primary immunodeficiency syndromes (severe combined immunodeficiency, Nezelof's syndrome, Bruton's agammaglobulinemia, etc.).
          (5) "Non-immunoglobulin E-mediated allergic process": only for allergic disorders explicitly stated as non-IgE-mediated (allergic arthritis).
          Do NOT use for: hereditary/genetic diseases (use occurrence=Congenital instead), general neoplasms, traumatic injuries, autoimmune arthropathies unless named above.
      - severity: mild, moderate, severe
      - finding_context: known present, known absent, suspected, etc.
      - subject_relationship_context: family member, mother, subject of record
      - temporal_context: current, past, current or past
      - finding_asso_with: the primary associated condition when the term is explicitly "X in [Disease Y]", "X associated with Y", or "X complicating Y", and Y is a named disease that is neither the morphology, causative agent, nor finding site. Use when the term's meaning is defined by its occurrence in the context of a specific named disease. Example: "Arthropathy in SLE" → finding_asso_with = Systemic lupus erythematosus; "Myocarditis in COVID-19" → finding_asso_with = COVID-19; "Anemia in neoplastic disease" → finding_asso_with = Neoplastic disease. Do NOT use for causative agents (bacteria, viruses as direct causes → use causative_agent instead).

      CONTEXT ATTRIBUTES — scan EVERY term for these (add even when only implied):
      | Attribute | Meaning | Cue words | Example |
      |-----------|---------|-----------|---------|
      | During | temporal phase of care | delivery, labour, antenatal, intrapartum, postpartum, perinatal, neonatal, peri-operative, post-op, recovery | "Postoperative hemorrhage" → During = Postoperative period |
      | finding_context | certainty / clinical status | history of, family history, Hx of, status post, suspected, ruled out, screening for, risk of, resolved | "Suspected appendicitis" → finding_context = Suspected |
      | subject_relationship_context | relationship of subject | maternal, paternal, fetal, sibling, twin, donor, recipient, caregiver, neonate of | "Maternal diabetes" → relat_context = Maternal |

      IMPLICIT ATTRIBUTE EXAMPLES:
      - "Chronic kidney disease stage 5" → clinical_course: "chronic", finding_site: "kidney structure", interprets_interpretation: [{{"interprets": "Renal function", "interpretation": "below reference range"}}]
      - "Trachoma" → finding_site: "conjunctival structure", causative_agent: "chlamydia trachomatis", associated_morphology: "inflammation", pathological_process: "Infectious process"  # named pathogen → pathological_process
      - "Gonorrhea of pharynx" → finding_site: "pharyngeal structure", causative_agent: "Neisseria gonorrhoeae", pathological_process: "Infectious process"  # named pathogen
      - "Acute tonsillitis" → associated_morphology: "inflammation", finding_site: "tonsillar structure", clinical_course: "acute", pathological_process: null  # generic acute infection — no named pathogen, no pathological_process
      - "Cellulitis of leg" → associated_morphology: "cellulitis", finding_site: "leg structure", pathological_process: null  # generic infection without named pathogen
      - "Chronic hemolytic anemia" → interprets_interpretation: [{{"interprets": "hemolysis", "interpretation": "present"}}, {{"interprets": "red blood cell count", "interpretation": "below reference range"}}]
      - "Hereditary spherocytosis" → associated_morphology: "spherocytosis", occurrence: "congenital", pathological_process: null  # hereditary blood disorder — NOT developmental process
      - "Congenital anomaly of pharynx" → associated_morphology: "morphologically abnormal structure", finding_site: "pharyngeal structure", occurrence: "congenital", pathological_process: "pathological developmental process"  # structural congenital anomaly → developmental process
      - "Primary malignant neoplasm of urinary bladder" → associated_morphology: "malignant neoplasm", finding_site: "bladder structure", pathological_process: "primary malignant neoplastic proliferation"  # explicit "primary malignant neoplasm" label
      - "Sinus node dysfunction" → associated_morphology: "dysfunction", finding_site: "sinoatrial node structure", interprets_interpretation: null  # dysfunction ≠ named lab test
      - "Acontractile detrusor" → associated_morphology: "acontractile structure", finding_site: "detrusor muscle structure", interprets_interpretation: null  # structural/functional finding, not a lab test
      - "Familial periodic paralysis" → associated_morphology: "paralysis", occurrence: "congenital", interprets_interpretation: null, pathological_process: null  # channelopathy — interprets not applicable; use occurrence for hereditary
      - "Multiple endocrine neoplasia, type 1" → associated_morphology: "neoplasm", finding_site: "endocrine structure", pathological_process: null  # MEN is NOT "primary malignant neoplasm of [site]"
      - "Nezelof's syndrome" → occurrence: "congenital", pathological_process: "abnormal immune process"  # primary immunodeficiency — NOT pathological developmental process

      {reference_section}

      === YOUR TASK ===
      For the medical term below, return JSON with attribute keys and list values (or null). Use clinical reasoning — think about what a domain expert would know, not just what words appear in the term. Multiple values per attribute are allowed.

      Return JSON only. Example:
      {{
          "associated_morphology": ["perforated ulcer"],
          "finding_site": ["duodenal structure"],
          "causative_agent": null,
          "interprets_interpretation": [
              {{"interprets": "gastric acid secretion", "interpretation": "increased"}}
          ],
          ...
      }}

    selection: |
      You are a SNOMED CT concept model expert. Select the best SNOMED CT concept for each attribute from the provided candidates.

      Rules:
      A. DURING (Time period qualifier):
         Cue words → Candidate concept
         • ante-, antepartum, antenatal, prenatal → Antepartum period
         • peri-, peripartum, intrapartum, labour/labor, delivery, childbirth → Intrapartum / Delivery period (select the concept that best matches wording; both map under Intrapartum period hierarchy)
         • post-, postpartum, puerperium, postnatal → Postpartum period
         • neonatal, newborn → Neonatal period

      If multiple cues appear, prefer the narrowest time span (e.g., "delivery" over "peripartum").
      B. Has interpretation & Has interprets (quantitative/functional change):
         • "hyper-", "hyperfunction", "over-", "elevated" → Has interpretation = Increased
         • "hypo-", "hypofunction", "insufficiency", "deficient" → Has interpretation = Decreased
         • For pituitary and gonadal hypo-/hyperfunction disorders (testicular hypofunction, panhypopituitarism, hyperpituitarism, gigantism, acromegaly, hypopituitarism), use "Hormone production" as the interprets observable — NOT "Hormone secretion". These are distinct SNOMED concepts. "Hormone secretion" applies only to disorders of active over-secretion (e.g., testicular hyperfunction). When in doubt, prefer "Hormone production".
         • For joint contracture/stiffness terms (Contracture of [joint], Multiple stiff joints), the interprets observable is "Range of [joint] movement" (e.g., "Elbow joint - range of movement") — NOT generic "Joint movement" or "Movement".
         • Do NOT assign interprets/interpretation for: organ dysfunction not defined by a named lab test, paralysis, structural congenital anomalies, or impaired movement due to arthropathy.

      C. Has severity: map adjectives to "Mild", "Moderate" ..., or "Severe" qualifier values; avoid choosing severity when no cue is present.
      D. Finding asso with: select the SNOMED CLINICAL FINDING concept representing the named associated disease. Prefer the most specific concept (e.g. "Systemic lupus erythematosus" over "Connective tissue disease"). Do not confuse with causative_agent — the associated condition is a co-occurring named disease, not an infectious organism or substance.
      C. Has associated morphology:
         – Only choose MORPHOLOGIC ABNORMALITY concepts (e.g., "Inflammatory morphology", "Malignant neoplasm").
         – Use inflammation cues ("-itis", "inflammatory"), neoplasm cues ("cancer", "malignant", "sarcoma", etc.), and hematologic change terms ("spherocytosis", "hemolytic").
         – If multiple valid morphologies exist, include each as separate values.
      0. For Has finding site:
         – Only select BODY STRUCTURE concepts (e.g., "Esophageal structure", "Laryngeal structure").
         – Prefer the most specific structure that completely represents the described site.
         – If both specific and general candidates appear, pick the more specific one.UCTURE that exactly matches the term if available; otherwise pick the next closest more-specific structure rather than a broader region (e.g., choose "Esophageal structure" over "Upper gastrointestinal tract structure").
         Example 1 (During): For "Post-operative infection", choose "Postoperative period (qualifier value)" over a generic "Post procedure period".
      Example 2 (Finding context): For "Possible pneumonia", choose "Possible (qualifier value)" rather than "Suspected (qualifier value)".
      Example 3 (Relat context): For "Family history of colon cancer", choose "Family history of (contextual qualifier)" over "History of (contextual qualifier)".
      1. Always keep context attributes (During, has_finding_context, has_relat_context) if the source phrase contains a matching keyword (history, family history, suspected, possible, postpartum, etc.). Only drop them when the candidate concept is semantically wrong.
      disproves them — deletion should be rare. For 'During', map common phrases:
         delivery, intrapartum → Intrapartum period
         postpartum, puerperal → Postpartum period
         postoperative → Postoperative period
         neonatal, newborn → Neonatal period
         prenatal, antepartum, pregnancy, gestational → Pregnancy period
      2. Prefer the most specific concept (e.g. "Pituitary gland" over "Endocrine gland").
      3. For [ALL valid values shown] attributes, pick the best match — do not leave blank.
      4. Reference examples of similar terms are strong signals — cross-validate with them.
      5. Select ONLY from provided candidates. Do not invent concept IDs.
      6. An attribute may have MULTIPLE correct values — return a list.
      7. "interprets" and "interpretation" are ALWAYS paired. Return together as "interprets_interpretation" — never one without the other.

      Return JSON:
      {
          "medical_term": "the input term",
          "attributes": {
              "associated_morphology": [{"concept_id": id, "concept_name": "name"}, ...] or null,
              "finding_site": [...] or null,
              "causative_agent": ...,
              "clinical_course": ...,
              "interprets_interpretation": [
                  {
                      "interprets": {"concept_id": id, "concept_name": "name"},
                      "interpretation": {"concept_id": id, "concept_name": "name"}
                  }, ...
              ] or null,
              "occurrence": ..., "pathological_process": ..., "severity": ...,
              "finding_context": ..., "subject_relationship_context": ..., "temporal_context": ...
          },
          "reasoning": "Brief explanation"
      }

