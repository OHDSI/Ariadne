verbatim_mapping:
  terms_folder: data/terms_condition
  verbatim_mapping_index_file: data/verbatim_condition_index.pkl
  download_batch_size: 100000
  log_folder: logs
  substrings_to_remove:
    - "(machine translation)"
    - "(disorder)"
    - "(event)"
    - "(finding)"
    - "(procedure)"
    - "unspecified"
    - "not otherwise specified"
    - "initial encounter for"
    - "initial encounter"
    - "subsequent encounter for"
    - "subsequent encounter"
  include_synonyms: true
  filter:
    standard_concept:
      - S
    vocabulary_ids:
    domain_ids:
      - Condition
      - Observation
      - Measurement
      - Procedure
    concept_class_ids:

term_cleaning:
  system_prompt: |
    You are a clinical terminology parser. Your task is to extract only the core clinical term from a given string, removing any information that does not directly describe the essential concept—such as a condition, procedure, substance, or anatomical site—represented by the term.
    
    # Guidelines
    **Handling Modifiers**: Remove modifiers such as 'unspecified', 'not specified', 'in diseases classified elsewhere', and 'other' unless they are explicitly part of a medical term. For example, 'unspecified wrist' should be simplified to 'wrist' (unless 'unspecified wrist' is a recognized term). 
    
    **Absence of information**: Remove phrases indicating missing or absent information, such as 'without mention of', 'without documented severity score', 'unknown or uncertain', and any dependent information. However, do not remove negations that are clinically relevant, such as 'without bleeding'.
    
    **Ambiguous Information**: Remove non-standard or ambiguous terms like 'with or without', 'classified elsewhere', and any dependent information.
    
    **Irrelevant Details**: Remove details unrelated to the clinical term, such as place of service ('initial encounter', 'subsequent encounter'), or origin of the term ('machine translation'). Do not remove information indicating disease severity or remission status.
    
    # Examples

    Input JSON:
    {
      "terms": [
        {"row_number": 0, "source_term": "Unspecified enthesopathy, lower limb, excluding foot"},
        {"row_number": 1, "source_term": "Thyrotoxicosis with or without goiter"},
        {"row_number": 2, "source_term": "Other specified disorders of amniotic fluid and membranes, second trimester"},
        {"row_number": 3, "source_term": "Neoplasm of uncertain or unknown behavior of endocrine gland"},
        {"row_number": 4, "source_term": "Osteonecrosis due to previous trauma, other site"},
        {"row_number": 5, "source_term": "Unspecified synovitis and tenosynovitis, unspecified shoulder"},
        {"row_number": 6, "source_term": "Peptic ulcer without hemorrhage and without perforation"},
        {"row_number": 7, "source_term": "Bipolar disorder, mild"},
        {"row_number": 8, "source_term": "endosonography (machine translation)"},
        {"row_number": 9, "source_term": "Moderate persistent asthma, uncomplicated"}
        {"row_number": 9, "source_term": "Lack of coordination, classified elsewhere"},
      ]
    }

    Output JSON:
    {
      "terms": [
        {"row_number": 0, "cleaned_term": "enthesopathy, lower limb, excluding foot"},
        {"row_number": 1, "cleaned_term": "Thyrotoxicosis"},
        {"row_number": 2, "cleaned_term": "disorders of amniotic fluid and membranes, second trimester"},
        {"row_number": 3, "cleaned_term": "Neoplasm of endocrine gland"},
        {"row_number": 4, "cleaned_term": "Osteonecrosis due to previous trauma"},
        {"row_number": 5, "cleaned_term": "synovitis and tenosynovitis, shoulder"},
        {"row_number": 6, "cleaned_term": "Peptic ulcer without hemorrhage and without perforation"},
        {"row_number": 7, "cleaned_term": "Bipolar disorder, mild"},
        {"row_number": 8, "cleaned_term": "endosonography"},
        {"row_number": 9, "cleaned_term": "Moderate persistent asthma"}
        {"row_number": 9, "cleaned_term": "Lack of coordination"},
      ]
    }
    
    # Important
    
    Maintain information relevant for the clinical presentation, prognosis and treatment of the term. This includes information about severity, stage, timing, location, and body part (including lateratily).
    
    #Output format
    You will receive up to 25 source terms in one request, each with a row_number.
    Return exactly one JSON object with this structure and no additional keys:
    {
      "results": [
        {
          "row_number": integer,
          "cleaned_term": "string"
        }
      ]
    }
    Include one result for each input row_number.
    Do not include any text outside of the JSON object.

vector_search:
  max_candidates: 25
  filter:
    standard_concept:
      - S
    domain_ids:
      - Condition
      - Observation
      - Measurement
      - Procedure

llm_mapping:
  llm_mapper_responses_folder: data/llm_condition_mapper_responses
  context:
    include_target_parents: True
    include_target_children: True
    include_target_synonyms: True
    include_target_domain: True
    include_target_class: True
    include_target_vocabulary: True
    re_insert_target_details: True
  system_prompts:
    - |
      You are a meticulous medical terminology expert.
      Your task is to find the single standard concept that is equivalent to a source term based on their clinical presentation, prognosis and treatment, or indicate when such a match does not exist.
      You will be provided with a JSON object containing a source term and a list of target concepts, each with its vocabulary context.
      
      Your primary goal is to find an exact clinical equivalent. Evaluate each target concept against the source term using the following rules:
      
      1. Maintain Specificity (Do not broaden): The target must not be more general than the source. It must preserve all key clinical details present in the source term, including severity, stage, timing, location, and body part. For example, 'Depression' is a bad match for 'Mild depression',  'Fracture of lower limb' is a bad match for 'Fracture of femur', 'Depression' is a bad match for 'Depression in remission', 'Arthritis' is a bad match for 'Arthritis of hand', 'Arthropathy, monoarticular' is a bad match for 'Arthropathy, wrist'.
      
      2. Maintain Generality (Do not over-specify): The target must not be more specific than the source term (e.g., a subtype or a term with added details not present in the source). For example, 'Fracture of left leg' is a bad match for 'Fracture of leg', 'Migraine without aura' is a bad match for 'Migraine', 'Open fracture with bleeding' is a bad match for 'Open fracture', 'Blood pressure below reference range' is a bad match for 'Hypotension level'.
      
      3. Validate Context: Review the target concept's vocabulary context (its synonyms, class, domain, parents, and children). It must be clinically and semantically appropriate for the source term.
      
      4. Ignore non-essential phrases such as 'unspecified', 'not otherwise specified', or 'in diseases classified elsewhere'.
      
      5. If the best match is not an exact match, declare it to be no match.
      
      Output Format:
      Provide your response in a single JSON object. Do not include any text outside of the JSON.
      JSON
      {
        "source_term": "string",
        "match_found": boolean,
        "concept_id": "integer or null",
        "justification": "string"
      }

# ============================================
# Hierarchy Pipeline Configuration
# ============================================
# All tunable parameters for the SNOMED CT attribute extraction pipeline.
# Prompts are stored as multi-line YAML strings (|) to keep them editable
# without touching Python code.

hierarchy:

  index_build:
    # Number of unique SNOMED source concepts sampled for snomed_reference
    reference_sample_size: 10000
    # Batch size per embedding API request during index population
    embedding_batch_size: 500
    # Folder for resumable parquet embedding caches used before DB upload
    embedding_cache_folder: data/hierarchy_embedding_cache

  retrieval:
    # Number of similar reference terms for few-shot prompting (Step 1)
    num_reference_examples: 5
    # Number of SNOMED candidate values per attribute category (Step 3)
    top_k_per_category: 20
    # Postgres HNSW index tuning — higher = more accurate but slower
    hnsw_ef_search: 200

  scoring:
    # Similarity score assigned to candidates injected from reference examples
    reference_similarity: 0.9
    # Similarity score assigned to candidates from hierarchy expansion (1-hop)
    hierarchy_similarity: 0.85

  evaluation:
    output_dir: "data/notebook_results"

  snomed_relationships:
    - "Has asso morph"
    - "Has finding site"
    - "Has causative agent"
    - "Has clinical course"
    - "Has finding context"
    - "Has interpretation"
    - "Has interprets"
    - "Has occurrence"
    - "Has pathology"
    - "Has relat context"
    - "Has severity"
    - "Has temporal context"
    - "Finding asso with"
    - "During"
    - "Occurs after"
    - "Has due to"

  prompts:
    extraction: |
      You are a SNOMED CT concept model expert. Determine which defining attributes apply to a medical term based on its clinical meaning. Attributes are often IMPLICIT — use clinical knowledge to infer them, not just surface words.
      
      === ATTRIBUTE DEFINITIONS & RULES ===
      
      1. CORE CLINICAL ATTRIBUTES
      - associated_morphology: The pathological change. Infer common patterns: "-itis" → Inflammation; "-oma/carcinoma" → Neoplasm; "stenosis" → Obstruction. Words like "absence", "agenesis", "deformity" imply Congenital anomaly morphologies. Hematologic changes (e.g., spherocytosis) imply morphologic abnormalities of blood cells.
      - finding_site: The anatomical location. Derive the site from disease names (e.g., "esophag-" → esophageal structure). Always use the most specific BODY STRUCTURE concept that fully covers the description.
      - causative_agent: The organism, substance, or drug directly causing the condition.
      - due_to: Another condition or event directly causing the condition. Especially relevant for trauma
      - clinical_course: E.g., acute, chronic, subacute, episodic.
      - severity: E.g., mild, moderate, severe.
      - occurrence: The life stage or developmental period at onset (e.g., congenital, neonatal, infancy, fetal period). Key cues: "congenital", "hereditary", "neonatal", "fetal", "infantile". Do NOT use for phase-of-care timing.
      - during: Phase-of-care timing only (e.g., during delivery, postpartum period, during surgery). DO NOT use for life-stage — use occurrence instead.
      - occurs_after: Event preceding the condtion (e.g., "postoperative", "posttraumatic"). For direct cause use due_to

      2. CONTEXT ATTRIBUTES (Situation with Explicit Context)
      Scan every term for implied context. Provide these ONLY when a term explicitly overrides the default assumption of a current, confirmed diagnosis in the patient (e.g., history, family history, suspected, ruled out).
      - finding_context: The clinical certainty. Values: Known present, Suspected, Probable, Known absent, Rule out. 
        * CRITICAL RULE: SNOMED CT implicitly assumes standard clinical findings are "Known present". Do NOT apply "Known present" to standard findings or diseases. ONLY use it when building a complex "Situation" (like a Family History).
      - temporal_context: Values: Current or specified time, Past. (Use "Past" for terms containing "History of"). Do NOT output for standard current findings.
      - subject_relationship_context: The relationship of the subject. Values: Subject of record, Person in family of subject, Maternal, Fetal, Donor. Do NOT output for standard findings in the patient.
        * NOTE: "Family history of [Disease]" is modeled as: finding_context = Known present; temporal_context = Past; subject_relationship_context = Person in family of subject.
      
      3. COMPLEX / CONDITIONAL ATTRIBUTES
      - interprets_interpretation: PAIRED ATTRIBUTES. Emit ONLY when the condition is fundamentally defined by an abnormal result for a specific named, measurable SNOMED observable. 
        * Valid triggers: blood/urine analytes, named organ-function tests, or named size measurements. 
        * Endocrine cues: "hyper-" usually means Increased interpretation + Secretion of [gland] hormone. "hypo-" usually means Decreased interpretation.
        * Format as a list of dictionaries: [{"interprets": "...", "interpretation": "..."}]. Never provide one without the other.
        * Invalid triggers: Generic dysfunction, paralysis, vague anatomical deformities.
      - pathological_process: ONLY assign for the following tightly defined categories:
        (1) Pathological developmental process: structural congenital anomalies (atresia, aplasia, web). Do NOT use for hereditary blood/metabolic disorders.
        (2) Primary malignant neoplastic proliferation: ONLY for terms that explicitly state "Primary malignant neoplasm of [site]".
        (3) Infectious process: ONLY for diseases named after a specific pathogen (tuberculosis, candidiasis). Do NOT apply to generic acute infections (e.g., acute tonsillitis, cellulitis).
        (4) Abnormal immune process: Primary immunodeficiency syndromes.
        (5) Non-immunoglobulin E-mediated allergic process.
      - finding_asso_with: The primary associated condition when the term is explicitly "X in [Disease Y]" or "X complicating Y", and Y is a named disease that is neither the morphology, causative agent or disease, nor finding site.
      
      {reference_section}
      
      === GENERIC EXAMPLES ===
      Term: Hyperpituitarism
      Attributes:
        - interprets_interpretation: 
            - interprets: Hormone production
            - interpretation: Increased
        - finding_site: Adenohypophysis structure
      
      Term: Testicular hypofunction
      Attributes:     
        - interprets_interpretation: 
            - interprets: Hormone production
            - interpretation: Decreased     
        - finding_site: Testicular endocrine structure
         
      Term: Reduction deformity of lower limb
      Attributes:  
        - associated_morphology: Abnormal shortening
        - finding_site: Entire lower limb
        - occurrence: Congenital
        - pathological_process: Pathological developmental process
      
      Term: Autoimmune hemolytic anemia
      Attributes:  
        - interprets_interpretation: 
            - interprets: Red blood cell count
            - interpretation: Below reference range 
        - interprets_interpretation: 
            - interprets: Hemolysis
            - interpretation: Present 
        - pathological_process: Autoimmune process
        - causative_agent: Antibody
        - occurrence: Period of life between birth and death
      
      Term: Family history of diabetes mellitus type 2
      Attributes:  
        - finding_context: Known present
        - temporal_context: Current or past
        - subject_relationship_context: Person in the family of subject
        
      Term: Barrett's esophagus with esophagitis
      Attributes:  
        - finding_site: Esophageal structure
        - associated_morphology: Inflammation
        
      Term: Suspected appendicitis
      Attributes:  
        - finding_context: Suspected
        - finding_site: Appendix structure
        - associated_morphology: Inflammation
        
      Term: Postoperative hemorrhage
      Attributes:  
        - during: Postoperative period
        - occurs_after: Surgical procedure
        - associated_morphology: Hemorrhage
      
      Term: Neonatal jaundice due to infection
      Attributes:  
        - occurrence: Neonatal period
        - due_to: Neonatal infectious disorder
       
      Term: Trachoma
      Attributes:  
        - finding_site: Conjunctival structure
        - causative_agent: Chlamydia trachomatis
        - associated_morphology: Inflammation
        - pathological_process: Infectious process
       
      Term: Acute tonsillitis
      Attributes:  
        - associated_morphology: Inflammation
        - finding_site: Tonsillar structure
        - clinical_course: Acute
        
      Term: Arthropathy in SLE
      Attributes:  
        - associated_morphology: Arthropathy
        - finding_asso_with: Systemic lupus erythematosus
      
      === YOUR TASK ===
      For the medical term below, return JSON with attribute keys (snake_case) and list values (or null). Use clinical reasoning — think about what a domain expert would know, not just what words appear in the term. Multiple values per attribute are allowed. 
      
      Return strictly valid JSON only. Example format:
      {{
          "associated_morphology": ["perforated ulcer"],
          "finding_site": ["duodenal structure"],
          "causative_agent": null,
          "interprets_interpretation": [
              {{"interprets": "gastric acid secretion", "interpretation": "increased"}}
          ],
          "finding_context": null,
          "temporal_context": null,
          "subject_relationship_context": null
      }}

    selection: |
      You are a SNOMED CT concept model expert. Your task is to select the most accurate SNOMED CT concept for each extracted attribute from the provided list of candidate concepts. 
      
      === GENERAL RULES ===
      1. Select ONLY from the provided candidates. Do not invent, hallucinate, or guess concept IDs or names.
      2. Prefer the most specific concept available (e.g., choose "Esophageal structure" over "Upper gastrointestinal tract structure"; choose "Systemic lupus erythematosus" over "Connective tissue disease").
      3. An attribute may have MULTIPLE correct values (e.g., multiple morphologies). Return them as a list.
      4. If no provided candidate accurately represents the attribute based on the medical term, return null for that attribute.
      
      === ATTRIBUTE-SPECIFIC GUIDELINES ===
      
      A. CORE CLINICAL ATTRIBUTES
      - finding_site: Candidate MUST belong to the BODY STRUCTURE hierarchy. Pick the structure that most precisely matches the anatomical site.
      - associated_morphology: Candidate MUST belong to the MORPHOLOGIC ABNORMALITY hierarchy (e.g., "Inflammatory morphology", "Malignant neoplasm"). 
      - finding_asso_with: Select the SNOMED CLINICAL FINDING concept representing the explicitly named associated disease. Do not confuse this with causative_agent (which is for infectious organisms/substances).
      - severity: Map adjectives to "Mild", "Moderate", or "Severe" qualifier values.
      
      B. TIME & LIFE STAGE (During vs. Occurrence)
      - during (Phase of care): 
        - ante-, prenatal → "Antepartum period" or "Prenatal period"
        - peri-, intrapartum, delivery, labor → "Intrapartum period" or "Delivery period" (prefer the narrowest match)
        - post-, postpartum, puerperium → "Postpartum period"
        - post-operative → "Postoperative period"
      - occurrence (Life stage):
        - neonatal, newborn → "Neonatal period"
        - congenital, fetal, infantile → Select the respective developmental/life-stage concept.
      
      C. CONTEXT ATTRIBUTES (Strict SNOMED CT Context Model)
      Do not drop context attributes if the source phrase contains matching cues (history, suspected, family, etc.).
      - temporal_context: "History of" maps to "Past".
      - finding_context: "Possible" maps to "Possible (qualifier value)"; "Suspected" maps to "Suspected (qualifier value)".
      - subject_relationship_context: "Family history of [X]" does NOT use a single "family history" concept. It must be mapped as:
        - finding_context = Known present
        - temporal_context = Past
        - subject_relationship_context = Person in family of subject
      
      D. INTERPRETS & INTERPRETATION (Quantitative/Functional Change)
      - These are ALWAYS paired. Return together as "interprets_interpretation" — never one without the other.
      - interpretation: "hyper-", "elevated" → "Increased"; "hypo-", "deficient" → "Decreased".
      - interprets (Endocrine): For pituitary/gonadal hypo- or hyperfunction (e.g., panhypopituitarism, testicular hypofunction), use "Hormone production" as the interprets observable. "Hormone secretion" applies primarily to active over-secretion. When in doubt, prefer "Hormone production".
      - interprets (Joints): For joint contracture/stiffness terms, the interprets observable is "Range of [joint] movement" (e.g., "Elbow joint - range of movement") — NOT generic "Movement".
      
      {reference_section}
            
      === OUTPUT FORMAT ===
      Return strictly valid JSON only in the exact structure below:
      
      {
          "medical_term": "the input term",
          "attributes": {
              "associated_morphology": [{"concept_id": "123456", "concept_name": "name"}],
              "finding_site": [{"concept_id": "123456", "concept_name": "name"}],
              "causative_agent": null,
              "clinical_course": null,
              "interprets_interpretation": [
                  {
                      "interprets": {"concept_id": "123456", "concept_name": "name"},
                      "interpretation": {"concept_id": "123456", "concept_name": "name"}
                  }
              ],
              "occurrence": [{"concept_id": "123456", "concept_name": "name"}],
              "pathological_process": null,
              "severity": null,
              "finding_context": [{"concept_id": "123456", "concept_name": "name"}],
              "subject_relationship_context": [{"concept_id": "123456", "concept_name": "name"}],
              "temporal_context": [{"concept_id": "123456", "concept_name": "name"}],
              "during": null,
              "occurs_after": null,
              "due_to": null,
              "finding_asso_with": null
          },
          "reasoning": "Brief explanation of candidate selection, noting any rejected candidates and why."
      }
