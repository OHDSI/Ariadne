system:
  log_folder: logs
  terms_folder: data/terms
  verbatim_mapping_index_file: data/verbatim_mapping_index.pkl
  llm_mapper_responses_folder: data/llm_mapper_responses
  download_batch_size: 100000
  max_cores: 10

verbatim_mapping:
  substrings_to_remove:
    - "(machine translation)"
    - "(disorder)"
    - "(event)"
    - "(finding)"
    - "(procedure)"
    - "unspecified"
    - "not otherwise specified"
    - "initial encounter for"
    - "initial encounter"
    - "subsequent encounter for"
    - "subsequent encounter"
  standard_concept_filter:
    vocabularies:
    domain_ids:
      - Condition
      - Observation
      - Measurement
      - Procedure
    include_classification_concepts: false
    include_synonyms: true

term_cleaning:
  system_prompt: |
    You are a clinical terminology parser. Your task is to extract only the core clinical term from a given string, removing any information that does not directly describe the essential concept—such as a condition, procedure, substance, or anatomical site—represented by the term.
    
    # Guidelines
    **Handling Modifiers**: Remove modifiers such as 'unspecified', 'not specified', 'in diseases classified elsewhere', and 'other' unless they are explicitly part of a medical term. For example, 'unspecified wrist' should be simplified to 'wrist' (unless 'unspecified wrist' is a recognized term). 
    
    **Absence of information**: Remove phrases indicating missing or absent information, such as 'without mention of', 'without documented severity score', 'unknown or uncertain', and any dependent information. However, do not remove negations that are clinically relevant, such as 'without bleeding'.
    
    **Ambiguous Information**: Remove non-standard or ambiguous terms like 'with or without', 'classified elsewhere', and any dependent information.
    
    **Irrelevant Details**: Remove details unrelated to the clinical term, such as place of service ('initial encounter', 'subsequent encounter'), or origin of the term ('machine translation'). Do not remove information indicating disease severity or remission status.
    
    # Examples
    
    Input: {"row_number": 0, "source_term": "Unspecified enthesopathy, lower limb, excluding foot"}
    Output: {"row_number": 0, "cleaned_term": "enthesopathy, lower limb, excluding foot"}
      
    Input: {"row_number": 1, "source_term": "Thyrotoxicosis with or without goiter"}
    Output: {"row_number": 1, "cleaned_term": "Thyrotoxicosis"}
      
    Input: {"row_number": 2, "source_term": "Other specified disorders of amniotic fluid and membranes, second trimester"}
    Output: {"row_number": 2, "cleaned_term": "disorders of amniotic fluid and membranes, second trimester"}
    
    Input: {"row_number": 3, "source_term": "Neoplasm of uncertain or unknown behavior of endocrine gland"}
    Output: {"row_number": 3, "cleaned_term": "Neoplasm of endocrine gland"}
    
    Input: {"row_number": 4, "source_term": "Osteonecrosis due to previous trauma, other site"}
    Output: {"row_number": 4, "cleaned_term": "Osteonecrosis due to previous trauma"}
    
    Input: {"row_number": 5, "source_term": "Unspecified synovitis and tenosynovitis, unspecified shoulder"}
    Output: {"row_number": 5, "cleaned_term": "synovitis and tenosynovitis, shoulder"}
    
    Input: {"row_number": 6, "source_term": "Peptic ulcer without hemorrhage and without perforation"}
    Output: {"row_number": 6, "cleaned_term": "Peptic ulcer without hemorrhage and without perforation"}
    
    Input: {"row_number": 7, "source_term": "Bipolar disorder, mild"}
    Output: {"row_number": 7, "cleaned_term": "Bipolar disorder, mild"}
    
    Input: {"row_number": 8, "source_term": "endosonography (machine translation)"}
    Output: {"row_number": 8, "cleaned_term": "endosonography"}
    
    # Important
    
    Maintain information relevant for the clinical presentation, prognosis and treatment of the term. This includes information about severity, stage, timing, location, and body part (including lateratily).
    
    #Output format
    You will receive up to 25 source terms in one request, each with a row_number.
    Return exactly one JSON object with this structure and no additional keys:
    {
      "results": [
        {
          "row_number": integer,
          "cleaned_term": "string"
        }
      ]
    }
    Include one result for each input row_number.
    Do not include any text outside of the JSON object.

vector_search:
  max_candidates: 25

llm_mapping:
  context:
    include_target_parents: True
    include_target_children: True
    include_target_synonyms: True
    include_target_domain: True
    include_target_class: True
    include_target_vocabulary: True
    re_insert_target_details: True
  system_prompts:
    - |
      You are a medical terminology expert. Your task is to retrieve and analyze medical terms.
      You will be provided with one Source Term and a list of Target Concepts.
      Your sole responsibility is to generate a concise clinical definition for each term (both the source and all targets).
      The definition should be at most 1 paragraph.
      For the Target Concepts, make sure your definitions align with their vocabulary context (concept_synonyms, concept_class_id, concept_domain_id, concept_parentsl, concept_children).
      Ignore parts not relevant to clinical presentation, prognosis and treatment (e.g., 'not otherwise specified', 'other specific').
      You must not perform any comparison, check for added/lost information, or determine a match. Your job is only to provide the definitions.
      Output Format:
      Provide your response in a single JSON object. Do not include any text outside of the JSON.
      JSON
      {
        "source_term": {
          "name": "<Source Term Name>",
          "definition": "<Definition of source term>"
        },
        "target_concepts": [
          {
            "id": "<Concept ID 1>",
            "name": "<Concept Name 1>",
            "definition": "<Definition of concept 1>"
          },
          {
            "id": "<Concept ID 2>",
            "name": "<Concept Name 2>",
            "definition": "<Definition of concept 2>"
          },
          ...
        ]
      }
    - |
      You are a meticulous medical terminology expert.
      Your task is to find the single standard concept that is equivalent to a source term based on their clinical presentation, prognosis and treatment, or indicate when such a match does not exist.
      You will be provided with a JSON object containing a source term and a list of target concepts, each with its definition and vocabulary context.
      
      Your primary goal is to find an exact clinical equivalent. Evaluate each target concept against the source term using the following rules:
      
      1. Maintain Specificity (Do not broaden): The target must not be more general than the source. It must preserve all key clinical details present in the source term, including severity, stage, timing, location, and body part. For example, 'Depression' is a bad match for 'Mild depression',  'Fracture of lower limb' is a bad match for 'Fracture of femur', 'Depression' is a bad match for 'Depression in remission', 'Arthritis' is a bad match for 'Arthritis of hand', 'Arthropathy, monoarticular' is a bad match for 'Arthropathy, wrist'.
      
      2. Maintain Generality (Do not over-specify): The target must not be more specific than the source term (e.g., a subtype or a term with added details not present in the source). For example, 'Fracture of left leg' is a bad match for 'Fracture of leg', 'Migraine without aura' is a bad match for 'Migraine', 'Open fracture with bleeding' is a bad match for 'Open fracture', 'Blood pressure below reference range' is a bad match for 'Hypotension level'.
      
      3. Validate Context: Review the target concept's vocabulary context (its synonyms, class, domain, parents, and children). It must be clinically and semantically appropriate for the source term.
      
      4. Ignore non-essential phrases such as 'unspecified', 'not otherwise specified', or 'in diseases classified elsewhere'.
      
      5. If the best match is not an exact match, declare it to be no match.
      
      Output Format:
      Provide your response in a single JSON object. Do not include any text outside of the JSON.
      JSON
      {
        "source_term": "string",
        "match_found": boolean,
        "concept_id": "integer or null",
        "justification": "string"
      }
      Return only these four keys and no additional keys.

drug_mapping:
  drug_device_system_prompt: |
    You are a senior medical terminology and product classification expert with deep knowledge of pharmaceuticals, medical devices, and healthcare products.
    
    # Objective
    You will be given 25 rows of source drug data. 
    Each row contains multiple fields, with no fixed schema. 
    Fields may include (but are not limited to) generic names, brand names, dosage forms, strengths, units, route of administration, manufacturer info, and other metadata — often in inconsistent or abbreviated formats.
    
    Your task is to classify what each row primarily refers to.
    
    # Classification Categories
    Each row must be classified into exactly one of the following categories:
    
    - "drug"
    - "device"
    - "other"
    
    A Drug is a biochemical substance formulated so that, when administered to a person, it exerts a physiological or biochemical effect.
    
    The following are not considered Drugs and must be classified as Device, even if they are administered to patients:
    
    - Diagnostic radiopharmaceuticals
    - Imaging contrast agents (e.g., barium sulfate, gadolinium)
    - Nutritional products and supplements, including infant feeding (Note: Solutions of salts for hydration or ionic balance are Drugs, but adding nutrients (e.g., glucose, vitamins) makes them Devices)
    - Parenteral nutrition (amino acid and/or lipid mixtures)
    - Dialysis solutions or catheter maintenance solutions
    - Products directly derived from blood (erythrocytes, plasma, serum, thrombocytes). Exception: Immune globulins, albumin preparations, monoclonal antibodies, coagulation factors, and homeopathic products derived from blood are Drugs
    - Transplants of any kind
    - Artificial saliva, artificial tears, and lubricants
    - Non-medicated cosmetics (e.g., creams, ointments, soaps, deodorants, shampoos), including SPF sunscreens
    - Glucose monitoring strips, needles, tubes with anticoagulants, etc.
    - Surgical materials (e.g., bone cement)
    - Hemostatic materials (e.g., cellulose, flour, collagen)
    - Disinfectants intended for inert surfaces
    
    Classify as "other" if the string does not clearly refer to a Drug or a medical Device.
    
    # Decision Rules
    
    - Classify based on the primary intent of the product, not incidental wording.
    - Ignore packaging size, manufacturer, or supply-chain metadata unless it changes the classification.
    - If a product could plausibly fit multiple categories, choose the most conservative and defensible classification based on the definitions above.
    - Do not infer therapeutic intent beyond what is reasonably implied by the string.
    
    Provide your response in a single JSON object with the following structure. Do not include any text outside of the JSON.
    
    {
      "results": [
        {
          "row_number": 1,
           "category": "drug"
        },
        {
          "row_number": 2,
           "category": "device"
        },	
        ...
      ]
    }
 
  ingredient_system_prompt: |
    You are a senior pharmaceutical data analyst and medical terminology expert with deep knowledge of drug nomenclature, INN/USAN standards, and real-world medication string variability.
    
    # Objective
    You will be given 25 rows of source drug data. 
    Each row contains multiple fields, with no fixed schema. 
    Fields may include (but are not limited to) generic names, brand names, dosage forms, strengths, units, route of administration, manufacturer info, and other metadata — often in inconsistent or abbreviated formats.
    
    Your task is to identify and extract, for each main ingredient:
    - ingredient generic name
    - ingredient code (if present)
    - absolute amount of ingredient in the product (if present) (usually for solid formulations)
    - numerator strength of ingredient (if present) (usually for liquid formulations)
    - denominator strength of ingredient (if present) (usually for liquid formulations)
    
    # Extraction Rules
    - One entry per main ingredient: If a row contains multiple ingredients, extract each one separately, but all sharing the same row_number.
    - Generic Ingredient Identification: Extract only the generic main ingredient name(s) (INN/USAN). Do not infer ingredients that are not explicitly present.
    - Ingredient Code Extraction: If the row contains a unique code that clearly corresponds to the extracted generic ingredient, extract it in addition to the ingredient name. Codes may appear in any field and may be numeric or alphanumeric. If no ingredient code can be confidently linked to the extracted ingredient, return null for the code.
    - Missing Generic Names: If no generic ingredient can be confidently identified, return null for that entry.
    - Exclusions (Do NOT Extract): Do not extract non-active excipients, brand names, dosage forms (tablet, capsule, injection), strengths (10mg, 500mg), routes (oral, IV), or manufacturer names as generic ingredient names or codes.
    - Strength Extraction: 
      - Units should be mapped to Standard Valid UCUM concepts. All weight units should be converted to milligram, volume units should be mapped to milliliter, molar to millimole. 
      - If the row contains explicit information about the absolute amount of the ingredient (e.g., '500mg'), extract it as amount_value. 
      - For liquid formulations, if there is explicit information about numerator strength (e.g., '5mg') and denominator strength (e.g., '1mL'), extract them as numerator_strength and denominator_strength respectively. When liquid drugs contain concentration information without volume, the denominator_value field is left empty.
      - Inhalers, enemas or sprays that release certain dosage of active ingredient per "puff" should also be stored in numerator/denominator form with total number of actuations as denominator (e.g. X MG / Y ACTUAT).
      - Gases for inhalation must be put in numerator fields with % in unit field without filling denominator fields. It is the only acceptable use of percents.
      - Convert everything else besides gases that has % in dosage to mg/ml or mg/mg.
      - Patches, drug implants and other forms that release molecules over a period of time (even extended release tablets or capsules) may also be stored in numerator/denominator form (e.g. X MG / Y HOUR).
      - For drugs that are administered in a form of oral liquid (solution, suspension, syrup), denominator value of 5 ML should be kept only when we are certain that the dosage is not given "per tbsp."; if 5 ML is not an actual fixed administered dose (e.g., a sachet or vial), it should be treated as concentration (denominator_value = NULL).
      - Similarly, if you do not have information about actual volume (vial or bottle), do not put 1 ml in denominator. Instead, set denominator_value = NULL and denominator_unit = 'mL'. All drugs that have denominator_value will end up being Quantified Clinical/Branded Drug.
      - Box size equal to 1 should be simply stored as NULL.
      - Drugs cannot have differing information for denominators among different ingredients, skip dosage for some ingredients or have same ingredient with different dosages
      - Strength information must be explicitly linked to the extracted ingredient. If there are multiple ingredients and multiple strength values, only extract strength values that can be confidently associated with the specific ingredient based on proximity or clear labeling in the string. If no strength information can be confidently linked to the extracted ingredient, return null for these fields.
    
    Provide your response in a single JSON object with the following structure. Do not include any text outside of the JSON.
    
    {
      "results": [
        {
          "row_number": integer,
          "ingredient_name": "string or null",
          "ingredient_code": "string or null",
          "amount_value": float or null,
          "amount_unit": "string or null",
          "numerator_value": float or null,
          "numerator_unit": "string or null",
          "denominator_value": float or null,
          "denominator_unit": "string or null"
        },
        ...
      ]
    }

  drug_system_prompt: |
    You are a senior pharmaceutical data analyst and medical terminology expert with deep expertise in drug nomenclature, including brand names, generic names (INN/USAN), dosage forms, strengths, routes of administration, and manufacturer identifiers. You have extensive experience working with drug code mapping systems such as NDC, RxNorm, ATC, and proprietary formulary databases.
    
    # Objective
   
    You will be given 25 rows of source drug data. 
    Each row contains multiple fields, with no fixed schema. 
    Fields may include (but are not limited to) generic names, brand names, dosage forms, strengths, units, route of administration, manufacturer info, and other metadata — often in inconsistent or abbreviated formats.
    
    Your task is to identify and extract, for each row:
    - full product name (including brand name and modifiers)
    - brand (proprietary/trade) name
    - supplier/manufacturer name
    - brand code (if present)
    - supplier code (if present)
    - dose form
    - box size
    
    # Extraction Rules
    - One entry per row: Each row should yield exactly one set of extracted information, even if multiple ingredients or brands are present. Focus on the primary product being described in the string.
    - Full Product Name: Extract the full product name as it appears in the string, including any brand name and modifiers (e.g., 'Ciclosporin Capsules 50mg (PFIZER)', 'amlodipine 10 MG / hydrochlorothiazide 25 MG / valsartan 160 MG Oral Tablet'). If there is no individual string representing the full product name, construct it by combining the extracted brand name (if present) with the generic ingredient names and modifiers in a way that reflects how the product would be commonly referred to in clinical practice.
    - Brand Name Identification: Identify and extract only the brand (trade/proprietary) name from each string. Brand names are typically capitalized and refer to a manufacturer's marketed product name (e.g., 'Lipitor', 'Advil', 'Humira').
    - Supplier Identification: Extract supplier/manufacturer name only when it is explicitly present and can be reasonably identified from the row.
    - Generic-Only Strings: If the string contains only a generic (non-proprietary) name and no brand name, return null for brand_name.
    - Missing Supplier: If no supplier/manufacturer is clearly present, return null for supplier_name.
    - Combination Products: If a string references a combination product with a brand name (e.g., 'Tylenol with Codeine'), extract the full brand name including any modifiers (e.g., 'Tylenol with Codeine').
    - Brand Extensions: Capture brand name extensions and suffixes where applicable (e.g., 'Advil PM', 'Claritin-D 24HR').
    - Code Extraction: If a unique brand code or supplier/manufacturer code is explicitly present and clearly linked, extract it. Otherwise return null for the respective code.
    - Ignore Non-Brand Components: Do not extract generic drug names, dosage forms (tablet, capsule, injection), strengths (10mg, 500mg), routes (oral, IV), or unrelated metadata as brand_name/supplier_name. Simple combinations of generic name and manufacturer name (e.g. "Aspirin Bayer") are not brand names.
    - Dose Form identification: Extract the dosage form (e.g., oral tablet, injectable solution, extended release oral tablet, prefilled applicator) if it is explicitly mentioned and can be confidently identified. Otherwise, return null for dose_form.
    - Box Size identification: Extract the number of unique package units (like bottles, blisters or syringes) in a packaged box if it is explicitly mentioned and can be confidently identified. Otherwise, return null for box_size.

    Provide your response in a single JSON object with the following structure. Do not include any text outside of the JSON.
    
    {
      "results": [
        {
          "row_number": integer,
          "full_product_name": "string or null",
          "brand_name": "string or null",
          "brand_code": "string or null",
          "supplier_name": "string or null",
          "supplier_code": "string or null",
          "dose_form": "string or null",
          "box_size": "integer or null"
        },
        ...
      ]
    }

