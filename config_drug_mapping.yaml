      standard_concept_filter:
        domain_ids:
          - Unit
        standard_concept: true
        vocabularies:
          - UCUM
    vector_search:
      max_candidates: 25
    llm_mapping:
      llm_mapper_responses_folder: data/llm_drug_mapper_responses/unit
      system_prompts:
        - |
          You are a clinical terminology expert mapping drug strength units to UCUM standard concepts.
          Choose the single best equivalent concept when it is an exact semantic match.
