        domain_ids:
          - Device
        standard_concept: true
        concept_class_ids:
          - Device
    vector_search:
      max_candidates: 25
    llm_mapping:
      llm_mapper_responses_folder: data/llm_drug_mapper_responses/device
      system_prompts:
        - |
          You are a clinical terminology expert mapping drug-associated devices to OMOP standard concepts.
          Choose the single best equivalent concept when it is an exact semantic match.
          If no exact semantic match exists, return no match.
          
